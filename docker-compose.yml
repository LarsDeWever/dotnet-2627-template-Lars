services:
  riseappdb:
    image: postgres:17
    container_name: riseappdb
    environment:
      POSTGRES_DB: rise
      POSTGRES_USER: rise
      POSTGRES_PASSWORD: letmeinplz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rise -d rise"]
      interval: 5s
      timeout: 5s
      retries: 10

  riseapp:
    build: .
    container_name: riseapp
    depends_on:
      riseappdb:
        condition: service_healthy
    environment:
      ConnectionStrings__DatabaseConnection: "Host=riseappdb;Port=5432;Database=rise;Username=rise;Password=letmeinplz"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8082:8080"

volumes:
  postgres-data:
